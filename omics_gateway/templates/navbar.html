<!-- Navigation bar used in website pages -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <div class="navbar-brand-container">
      <!-- Logo, from branding file; linked only when logo_url is set -->
      {% if branding.logo_path %}
      {% set logo %}
        <img src="{{ url_for('branding_asset', asset='logo') }}"
          alt="{{ branding.logo_alt or branding.page_title }}" height="50px"
          class="d-inline-block align-text-middle" />
      {% endset %}
      {% if branding.logo_url %}
      <a class="navbar-brand" href="{{ branding.logo_url }}"
        target="_blank" rel="noopener noreferrer">{{ logo }}</a>
      {% else %}
      <span class="navbar-brand">{{ logo }}</span>
      {% endif %}
      {% endif %}
      <!-- Title -->
      <a class="navbar-brand" href="{{ url_for('homepage') }}">
        {{ branding.page_title }}
      </a>
    </div>
    <!-- Collapsible menu for small screens -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNav" aria-controls="navbarNav"
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <!-- Menu pages -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('filecrawl') }}">Datasets</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('do_instances') }}">Instances</a>
        </li>
        <!-- One tutorial per viewer; each opens in new tab -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button"
            data-bs-toggle="dropdown" aria-expanded="false">Tutorials</a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item"
                href="https://cellxgene.cziscience.com/docs/04__Analyze%20Public%20Data/4_1__Hosted%20Tutorials"
                target="_blank" rel="noopener noreferrer">CellxGene</a>
            </li>
            <li>
              <a class="dropdown-item" href="https://vitessce.io/docs/components/"
                target="_blank" rel="noopener noreferrer">Vitessce</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
