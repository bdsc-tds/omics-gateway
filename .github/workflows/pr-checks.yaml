# Lint and test every pull request and every push to main

name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # Allow manual runs on any branch from Actions tab
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        uses: astral-sh/ruff-action@v4
        with:
          version: '0.16.0'
          args: 'check'
      - name: Check formatting
        uses: astral-sh/ruff-action@v4
        with:
          version: '0.16.0'
          args: 'format --diff'

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Login shell activates micromamba env
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      # Same pinned env as deployed gateway
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: deploy/cellxgateway_env.yaml
          cache-environment: true
      # --no-deps as in deploy/setup.sh: env file pins every dependency
      - name: Install gateway
        run: pip install --no-deps --editable .
      - name: Run tests
        run: python -m unittest discover tests
