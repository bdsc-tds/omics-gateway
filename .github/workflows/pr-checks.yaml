# Lint and test every pull request and every push to main

name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # Allow manual runs on any branch from Actions tab
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.16.0'
          args: 'check'
      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.16.0'
          args: 'format --diff'

  biome:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Login shell activates micromamba env
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      # Same pinned Biome as local env
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: biome_env.yaml
          cache-environment: true
      # Lint and formatting check in one command
      - name: Lint and check formatting
        run: biome ci

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Login shell activates micromamba env
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      # Same pinned env as deployed gateway
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: deploy/omics-gateway_env.yaml
          cache-environment: true
      # --no-deps as in deploy/setup.sh: env file pins every dependency
      - name: Install gateway
        run: pip install --no-deps --editable .
      # CI only: deployed env stays free of test tooling
      - name: Install coverage
        run: pip install coverage==7.16.2
      - name: Run tests
        run: coverage run -m unittest discover tests
      # Per-file table in log and on run's summary page, no external service
      - name: Report coverage
        run: |
          coverage report
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
